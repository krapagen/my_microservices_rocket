# Nginx как HTTP load balancer для нескольких инстансов OrderService.
#
# Как это работает:
# 1. Docker Compose запускает N реплик сервиса "order-service" (--scale order-service=3).
# 2. Docker DNS резолвит имя "order-service" в IP-адреса ВСЕХ реплик.
# 3. Nginx раскидывает запросы между ними round-robin.
# 4. vegeta (нагрузочный тест) стучит в один порт Nginx — тот распределяет по инстансам.
#
# Количество реплик НЕ задаётся в конфиге Nginx — оно определяется при запуске:
# docker compose up --scale order-service=3

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS. Обязателен для proxy_pass через переменную.
    #
    # Почему не upstream-блок: open-source nginx резолвит server-имя в upstream
    # ОДИН РАЗ при старте. Реплика, поднявшаяся позже или пересозданная с новым
    # IP, навсегда выпадает из ротации, а её доля через proxy_next_upstream
    # уходит соседнему пиру — отсюда перекос RPS по инстансам (~60/40/0).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # IAM: регистрация, вход, выход
        location /api/v1/auth/ {
            set $iam_upstream http://iam-service:8081;
            proxy_pass $iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # IAM: получение пользователя по UUID
        location /api/v1/users/ {
            set $iam_upstream http://iam-service:8081;
            proxy_pass $iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            # Переменная заставляет nginx перерезолвить имя с учётом TTL —
            # балансировка идёт через round-robin Docker DNS по живым репликам.
            set $order_upstream http://order-service:8080;
            proxy_pass $order_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
