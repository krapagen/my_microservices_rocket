grpc:
  host: "0.0.0.0"
  port: "50053"

http:
  host: "0.0.0.0"
  port: "8081"

rate_limit:
  rate: 200
  burst: 50

postgres:
  host: "localhost"
  port: "5434"
  database: "iam-service"
  user: "iam-service-user"
  password: "iam-service-password"
  sslmode: "disable"

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0
  connection_timeout: 5s
  max_idle: 10
  idle_timeout: 10s

session:
  ttl: 24h

logger:
  level: "info"

otel:
  endpoint: "localhost:4317"
  service_name: "iam-service"