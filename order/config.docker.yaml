logger:
  level: "warn"

otel:
  service_name: "order-service"
  endpoint: "otel-collector:4317"

http:
  host: "0.0.0.0"
  port: "8080"

pg:
  host: "postgres-order"
  port: "5432"
  database: "order-service"
  user: "order-service-user"
  password: "order-service-password"
  sslmode: "disable"

inventory_client:
  address: "inventory-service:50051"

payment_client:
  address: "payment-service:50052"

iam_client:
  address: "iam-service:50053"

kafka:
  brokers:
    - "kafka:29092"

order_paid_producer:
  topic: "order.paid"

ship_assembled_consumer:
  topic: "assembly.ship-assembled"
  group_id: "order-service"

rate_limit:
  redis_address: "redis-ratelimit:6379"
  rate: 200
  burst: 50
